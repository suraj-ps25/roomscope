[project]
name = "roomscope"
version = "0.0.1"
description = "Multi-tier iPhone capture to dimensioned, stitched floor plans with per-surface damage detection and scope."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
roomscope = "roomscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
