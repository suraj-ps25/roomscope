# Fix-loop entries. Each is one commit, found by a failing benchmark number, and
# regenerable: python benchmark/fix_loop/regenerate.py <id>

- id: video-door-sill
  title: Oblique doorways read as windows
  symptom: >-
    Video tier, flat_a with oracle depth: 4 of the 5 doors seen from the hallway and
    bathroom turns came out as windows with a 0.23 m sill, so they could not pair and
    the plan did not stitch.
  cause: >-
    In the opening evidence, a ray landing on the floor just beyond the wall plane voted
    both "wall face" and "through": the two classes overlapped. From the middle of a room
    the bottom of a side doorway is seen at 60-70 degrees, where every such ray lands
    within the face tolerance.
  fix: face and floor-beyond classes made exclusive; floor-beyond margin 0.4 x face tolerance
  capture: data/captures/sim_flat_a_video
  flags: [--oracle-depth]
  before: 8d57a7d
  after: bf0c5d5

- id: video-pixel-aspect
  title: Every video-tier height ~1% short
  symptom: >-
    Video tier, flat_a with oracle depth: ceilings 2.5-3.8 cm low in every room although
    each ceiling was perfectly flat and wall lengths were within 4 mm.
  cause: >-
    Decoding 720x1280 to 294x518 (patch multiples) scales x and y differently (0.4083 vs
    0.4047); focal self-calibration then set fy = fx, shrinking every vertical ray.
  fix: carry the decode's pixel aspect through the rotation search and into K
  capture: data/captures/sim_flat_a_video
  flags: [--oracle-depth]
  before: bf0c5d5
  after: 470c532

- id: lidar-floor-margin
  title: The door fix regressed LiDAR openings
  symptom: >-
    Re-running the LiDAR tier after video-door-sill: openings 8/9 -> 7/9, the hallway's
    bedroom door missed and adjacency wrong. The pre-fix commit on the same capture passed.
  cause: >-
    The tightened floor-beyond margin was a share (0.4) of the tier's wall-face tolerance:
    4.8 cm for photos but 1.6 cm for LiDAR, inside depth noise at the wall base.
  fix: explicit per-tier floor_beyond_m; LiDAR keeps 4 cm
  capture: data/captures/sim_flat_a_lidar
  flags: []
  before: 470c532
  after: 822fab3

- id: lidar-loop-tear
  title: Wrong loop closures tore the pose graph at the end of a capture
  symptom: >-
    LiDAR, flat_a seed 1 (seed 0 passed): openings 5/10, adjacency wrong, walls up to
    2.6 cm, and a phantom strip of hallway outside the flat. The last 4 s of corrected
    poses were up to 55 cm from truth.
  cause: >-
    Seven ICP loop closures from the final fragments back to the start had slid along the
    hallway. The Cauchy loss was applied to every edge, so the solver switched off the
    one odometry edge (73 -> 74) that disagreed with them by 0.6 m and tore the graph there.
  fix: robust weights (IRLS) on loop closures only; odometry is never robustified
  capture: data/captures/simbench/flat_a_lidar_d1_s1
  flags: []
  before: d53e04a
  after: 7633a27

- id: photo-depth-cap
  title: Far walls vanished from photo reconstructions
  symptom: >-
    Photo tier with true depth, Replica room0: 3.27 x 3.90 m for a 4.58 x 7.71 m room, with
    "no wall seen" on two sides. The synthetic hallway came out 3.1 m long for 5.0.
  cause: >-
    Every depth map was cut at 4 m, the LiDAR's useful range, for every tier. A corner photo
    of a long room is mostly far wall.
  fix: fuse takes a depth limit; the image tiers use 12 m
  capture: data/captures/replica/room0_photo
  flags: [--oracle-depth]
  before: bdb7174
  after: a1a7bf5

- id: lidar-one-sided-door
  title: A door seen from one side only broke adjacency
  symptom: >-
    LiDAR, a fourth independent capture of the flat: the hallway side of the bedroom door
    went undetected while the bedroom side measured it (0.851 m), so adjacency failed.
  cause: >-
    Adjacency needed the door detected on both faces of the wall; the hallway saw that
    doorway only obliquely and briefly.
  fix: an unpaired door is carried through its wall when another room's wall faces it a wall-thickness away
  capture: data/captures/sim_flat_a_lidar
  flags: []
  before: 9805f2f
  after: a3d59a8

- id: lidar-segmentation
  title: Rooms merged through gaps in the wall traces
  symptom: >-
    LiDAR, flat_a seed 1, after lidar-loop-tear had fixed its trajectory: adjacency still
    wrong and a 13.8 cm ceiling error; the hallway segmented together with the bathroom.
  cause: >-
    Wall directions were 2-degree histogram bin centres, so a trace a degree off fitted only
    part of a 5 m wall and stopped short; walls never seen just under the ceiling had no
    barrier at all; the observed-ceiling mask left holes where nobody looked up.
  fix: refined wall directions; traces extended along their own wall at any height; roof mask with hole filling
  capture: data/captures/simbench/flat_a_lidar_d1_s1
  flags: []
  before: b31c18c
  after: 2d74357

- id: real-ceiling-step
  title: A ceiling step cut a real room in two
  symptom: >-
    Real iPad recording (ARKitScenes 47429912) of a bathroom, against laser truth: the room
    came out 1.94 x 1.85 m for 2.72 x 1.98 m; one end of the room was missing.
  cause: >-
    The ceiling is lowered by 10 cm over one end. The vertical face of that step sat in
    the band under the ceiling where barriers are traced, ran the full room width, and was
    taken for a wall; the free space beyond it, entered by too few frames, was dropped.
  fix: a barrier must come down from the local ceiling by more than 15 cm over 30% of its length
  capture: data/public/arkitscenes/47429912
  truth: benchmark/ground_truth/arkitscenes_471428.yaml
  flags: []
  before: 1ddba65
  after: f2fa61a

- id: real-damage-false-positives
  title: Undamaged real rooms reported dozens of damage regions
  symptom: >-
    Real recording 47429922 of an undamaged living room: 59 damage regions (shelf and toy
    edges as cracks, a plant as mould, view seams as stains). On the synthetic flat the
    staged crack, above a door, was never seen (found only once the scorer checked where).
  cause: >-
    Views were ranked by how well they saw a surface's centre, so the strip above a door
    went unseen; objects in front of a wall leaked colour into its orthophoto at the
    LiDAR's depth resolution; mask outlines read as ridges; exposure steps between views
    read as stains.
  fix: coverage-chosen views, dense-geometry masks in front and in recesses, crack clearance from masks, per-view gain
  capture: data/public/arkitscenes/47429922
  truth: benchmark/ground_truth/arkitscenes_471425.yaml
  flags: []
  before: f57442f
  after: ed27738

- id: synthetic-damage-recall
  title: The staged crack was never found (the same fix, on the synthetic flat)
  symptom: >-
    Full-resolution LiDAR capture of the flat, damage scored at the staged place: 2/3 found
    and one false positive, a 0.49 m door-jamb edge that the old scorer had counted as the
    staged crack.
  cause: see real-damage-false-positives
  fix: see real-damage-false-positives
  capture: data/captures/sim_flat_a_lidar
  flags: []
  before: f57442f
  after: ed27738
